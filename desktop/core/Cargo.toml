[package]
name = "lawyermind-core"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "LawyerMind desktop core: private local PostgreSQL cluster. No network code."

[dependencies]
postgres = "0.19"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
rand = "0.8"
thiserror = "1"

[dev-dependencies]
tempfile = "3"
