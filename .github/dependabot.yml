version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      runtime:
        patterns:
          - "next"
          - "react"
          - "react-dom"
          - "next-auth"
      prisma:
        patterns:
          - "prisma"
          - "@prisma/*"
