name: Generate current initial migration

on:
  push:
    branches:
      - chore/initial-migration-v2

permissions:
  contents: write

jobs:
  migration:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/mblz_preview
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - name: Validate Prisma schema
        run: npx prisma validate
      - name: Generate current SQL from empty PostgreSQL schema
        run: npx prisma migrate diff --from-empty --to-schema prisma/schema.prisma --script -o /tmp/migration.sql
      - name: Verify migration
        shell: bash
        run: |
          test -s /tmp/migration.sql
          sha256sum /tmp/migration.sql
      - name: Commit generated migration
        shell: bash
        run: |
          target="prisma/migrations/20260930070000_initial"
          if [ -f "$target/migration.sql" ]; then
            echo "Migration already committed; nothing to do."
            exit 0
          fi
          mkdir -p "$target"
          cp /tmp/migration.sql "$target/migration.sql"
          printf 'provider = "postgresql"\n' > prisma/migrations/migration_lock.toml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add prisma/migrations
          git commit -m "db: add current initial Prisma migration"
          git push origin HEAD:chore/initial-migration-v2
