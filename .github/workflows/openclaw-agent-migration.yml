name: Generate OpenClaw agent migration

on:
  push:
    branches:
      - feat/openclaw-agent-gateway

permissions:
  contents: write

jobs:
  migration:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: mblz_agent_migration
        ports: [5432:5432]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/mblz_agent_migration
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Stop when migration already exists
        shell: bash
        run: |
          target="prisma/migrations/20260930173000_openclaw_agent/migration.sql"
          if [ -f "$target" ]; then
            echo "Migration already committed."
            exit 0
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --no-audit --no-fund
      - name: Apply current migrations
        run: npx prisma migrate deploy
      - name: Generate additive migration
        run: npx prisma migrate diff --from-config-datasource --to-schema prisma/schema.prisma --script -o /tmp/openclaw-agent.sql
      - name: Commit migration
        shell: bash
        run: |
          test -s /tmp/openclaw-agent.sql
          target="prisma/migrations/20260930173000_openclaw_agent"
          mkdir -p "$target"
          cp /tmp/openclaw-agent.sql "$target/migration.sql"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add prisma/migrations
          git commit -m "db: add OpenClaw agent migration"
          git push origin HEAD:feat/openclaw-agent-gateway
