name: Quality Gates

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: mblz_ci
        ports: [5432:5432]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/mblz_ci
      AUTH_SECRET: ci-only-auth-secret-not-for-production
      AUTH_GOOGLE_ID: ci-placeholder.apps.googleusercontent.com
      AUTH_GOOGLE_SECRET: ci-placeholder
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      TOKEN_ENCRYPTION_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      CRON_SECRET: ci-only-cron-secret
      RUN_DB_TESTS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Validate schema
        run: npm run db:validate
      - name: Typecheck
        run: npm run typecheck
      - name: Validate full migration chain on isolated database
        run: npx prisma migrate deploy
      - name: Prepare isolated test database
        run: npx prisma db push
      - name: Enforce normalized-email constraint in isolated database
        run: npx prisma db execute --file prisma/constraints/user-email-casefold.sql
      - name: Security regression tests
        run: npm test
      - name: Document editor browser regression
        run: npm run test:browser
      - name: Authenticated synthetic pilot E2E
        run: npm run test:pilot
        env:
          RUN_PILOT_E2E: "1"
      - name: Render synthetic DOCX with LibreOffice
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libreoffice-writer poppler-utils
          mkdir -p artifacts/pilot-e2e/libreoffice
          libreoffice -env:UserInstallation=file:///tmp/lawyermind-lo-ci --headless --convert-to pdf --outdir artifacts/pilot-e2e/libreoffice artifacts/pilot-e2e/documento-v3.docx
          test -s artifacts/pilot-e2e/libreoffice/documento-v3.pdf
          pdftotext artifacts/pilot-e2e/libreoffice/documento-v3.pdf artifacts/pilot-e2e/libreoffice/documento-v3.txt
          python3 scripts/check-docx-render.py
          pdftoppm -scale-to 1600 -png -f 1 -singlefile artifacts/pilot-e2e/libreoffice/documento-v3.pdf artifacts/pilot-e2e/libreoffice/page1
          pdftoppm -scale-to 1600 -png -f 1 -singlefile artifacts/pilot-e2e/documento-v3.pdf artifacts/pilot-e2e/pdf-page1
      - name: Preserve synthetic pilot evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: synthetic-pilot-evidence
          path: artifacts/pilot-e2e/
          retention-days: 7
      - name: Build
        run: npm run build
