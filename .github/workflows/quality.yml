name: Quality Gates

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: mblz_ci
        ports: ["127.0.0.1:5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/mblz_ci
      AUTH_SECRET: ci-only-auth-secret-not-for-production
      AUTH_GOOGLE_ID: ci-placeholder.apps.googleusercontent.com
      AUTH_GOOGLE_SECRET: ci-placeholder
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      TOKEN_ENCRYPTION_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      CRON_SECRET: ci-only-cron-secret
      RUN_DB_TESTS: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Validate schema
        run: npm run db:validate
      - name: Typecheck
        run: npm run typecheck
      - name: Provisioner safety tests (no database)
        run: node --test .github/scripts/provision-test-db.test.mjs
      - name: Provision exclusive test database
        env:
          CI_POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
        run: node .github/scripts/provision-test-db.mjs provision
      - name: Prepare isolated test database
        run: npx prisma db push
      - name: Security regression tests
        run: npm test
      - name: Build
        run: npm run build
      - name: Remove owned test database
        if: always()
        env:
          CI_POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
        run: node .github/scripts/provision-test-db.mjs cleanup
