name: Generate Telegram Agent migration

on:
  push:
    branches:
      - feat/agent-telegram

permissions:
  contents: write

jobs:
  migration:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: mblz_telegram_migration
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/mblz_telegram_migration
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --no-audit --no-fund
      - run: npx prisma validate
      - name: Apply current baseline migrations
        run: npx prisma migrate deploy
      - name: Generate additive Telegram migration
        run: npx prisma migrate diff --from-config-datasource --to-schema prisma/schema.prisma --script -o /tmp/telegram.sql
      - name: Commit migration
        shell: bash
        run: |
          test -s /tmp/telegram.sql
          target="prisma/migrations/20260930203000_agent_telegram"
          mkdir -p "$target"
          cp /tmp/telegram.sql "$target/migration.sql"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add prisma/migrations
          git commit -m "db: add Telegram Agent migration"
          git push origin HEAD:feat/agent-telegram
