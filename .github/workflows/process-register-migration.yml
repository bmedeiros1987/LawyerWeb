name: Generate process register migration

on:
  push:
    branches:
      - feat/process-register-v2

permissions:
  contents: write

jobs:
  migration:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: mblz_migration
        ports: [5432:5432]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/mblz_migration
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Stop when migration already exists
        shell: bash
        run: |
          target="prisma/migrations/20260930165000_process_register/migration.sql"
          if [ -f "$target" ]; then
            echo "Migration already committed."
            exit 0
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --no-audit --no-fund
      - name: Apply current baseline migrations
        run: npx prisma migrate deploy
      - name: Generate additive process-register SQL
        run: npx prisma migrate diff --from-url "$DATABASE_URL" --to-schema prisma/schema.prisma --script -o /tmp/process-register.sql
      - name: Validate and commit migration
        shell: bash
        run: |
          test -s /tmp/process-register.sql
          target="prisma/migrations/20260930165000_process_register"
          mkdir -p "$target"
          cp /tmp/process-register.sql "$target/migration.sql"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add prisma/migrations
          git commit -m "db: add process register migration"
          git push origin HEAD:feat/process-register-v2
